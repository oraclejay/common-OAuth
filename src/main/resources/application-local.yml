spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
